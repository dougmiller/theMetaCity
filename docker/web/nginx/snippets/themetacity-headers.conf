add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Xss-Protection "1; mode=block" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://assets.themetacity.com; media-src 'self' https://assets.themetacity.com; font-src 'self'; connect-src https://api.themetacity.com;" always;
add_header Referrer-Policy "no-referrer" always;
add_header Feature-Policy "vibrate 'none'; geolocation 'none'; midi 'none'; notifications 'none'; push 'none'; sync-xhr  'none'; microphone 'none'; camera 'none'; magnetometer 'none'; gyroscope 'none'; speaker 'https://assets.themetacity.com'; vibrate 'none'; fullscreen 'https://assets.themetacity.com'; payment 'none';" always;