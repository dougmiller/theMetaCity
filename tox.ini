[tox]
min_version = 4.22
env_list =
    py314
    lint
    type

[testenv]
passenv =
    TMC_TEST_DATABASE_URL
# uv-venv-lock-runner so tox honours uv.lock. Inherited by all envs.
runner = uv-venv-lock-runner
dependency_groups =
    dev
extras =
    debug
commands = pytest tests

[testenv:lint]
dependency_groups =
    dev
commands =
    ruff format --check --diff tmc tests
    ruff check tmc tests

[testenv:format]
dependency_groups =
    dev
commands =
    ruff format tmc tests
    ruff check --fix tmc tests

[testenv:type]
dependency_groups =
    dev
extras =
    debug
commands = basedpyright tmc
