            <rect x="0" y="0" width="100%" height="15%" fill="#591d48"/>
            <rect x="0" y="15%" width="100%" height="15%" fill="#8b225a"/>
            <rect x="0" y="30%" width="100%" height="15%" fill="#db305c"/>
            <rect x="0" y="45%" width="100%" height="15%" fill="#f89c54"/>
            <rect x="0" y="60%" width="100%" height="15%" fill="#ffdfbc"/>
