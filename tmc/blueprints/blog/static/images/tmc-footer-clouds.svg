<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" id="theMetaCityFooterClouds" width="1920" height="400">
    <defs>
        <linearGradient id="firstGradient" gradientTransform="rotate(90)">
            <stop offset="0%" stop-color="hsla(317, 51%, 23%, 0)" />
            <stop offset="100%" stop-color="hsla(317, 51%, 23%, 1)" />
        </linearGradient>

        <linearGradient id="secondGradient" gradientTransform="rotate(90)">
            <stop offset="0%" stop-color="hsla(328, 61%, 34%, 0)" />
            <stop offset="100%" stop-color="hsla(328, 61%, 34%, 1)" />
        </linearGradient>

        <linearGradient id="thirdGradient" gradientTransform="rotate(90)">
            <stop offset="0%" stop-color="hsla(345, 70%, 52%, 0)" />
            <stop offset="100%" stop-color="hsla(345, 70%, 52%, 1)" />
        </linearGradient>

        <linearGradient id="fourthGradient" gradientTransform="rotate(90)">
            <stop offset="0%" stop-color="hsla(26, 92%, 65%, 0)" />
            <stop offset="100%" stop-color="hsla(26, 92%, 65%, 1)" />
        </linearGradient>

        <linearGradient id="fifthGradient" gradientTransform="rotate(90)">
            <stop offset="0%" stop-color="hsla(31, 100%, 87%, 0)" />
            <stop offset="100%" stop-color="hsla(31, 100%, 87%, 1)" />
        </linearGradient>

        <linearGradient id="sixthGradient" gradientTransform="rotate(90)">
            <stop offset="0%" stop-color="hsla(170, 50%, 45%, 0)" />
            <stop offset="100%" stop-color="hsla(170, 50%, 45%, 1)" />
        </linearGradient>

        <rect id="firstBand" width="100%" height="15%"/>
        <rect id="secondBand" width="100%" height="15%"/>
        <rect id="thirdBand" width="100%" height="15%"/>
        <rect id="fourthBand" width="100%" height="15%"/>
        <rect id="fifthBand" width="100%" height="15%"/>
        <rect id="sixthBand" width="100%" height="25%"/>

        <pattern id="clouds" x="0" y="0" width="100%" height="100%">
            <use x="0" y="-5%" xlink:href="#firstBand" fill="url('#firstGradient')"/>
            <use x="0" y="0" xlink:href="#firstBand" fill="hsla(317, 51%, 23%, 1)"/>

            <use x="0" y="10%" xlink:href="#secondBand" fill="url('#secondGradient')"/>
            <use x="0" y="15%" xlink:href="#secondBand" fill="hsla(328, 61%, 34%, 1)"/>

            <use x="0" y="25%" xlink:href="#thirdBand" fill="url('#thirdGradient')"/>
            <use x="0" y="30%" xlink:href="#thirdBand" fill="hsla(345, 70%, 52%, 1)"/>

            <use x="0" y="40%" xlink:href="#fourthBand" fill="url('#fourthGradient')"/>
            <use x="0" y="45%" xlink:href="#fourthBand" fill="hsla(26, 92%, 65%, 1)"/>

            <use x="0" y="55%" xlink:href="#fifthBand" fill="url('#fifthGradient')"/>
            <use x="0" y="60%" xlink:href="#fifthBand" fill="hsla(31, 100%, 87%, 1)"/>

            <use x="0" y="70%" xlink:href="#sixthBand" fill="url('#sixthGradient')"/>
            <use x="0" y="75%" xlink:href="#sixthBand" fill="hsla(170, 50%, 45%, 1)"/>
        </pattern>
    </defs>
    <rect fill="url(#clouds)" width="100%" height="100%"/>
</svg>
