# theMetaCity — PRODUCTION server block: TLS + mutual-TLS + rate limiting.
#
# :80  -> plain health for uptime monitors, everything else redirected to https.
# :443 -> TLS; requires a client cert signed by YOUR ca.crt (ssl_verify_client on).
#         A request without a valid client cert is rejected at the handshake,
#         before Flask ever sees it. Rate limit applied on top.

upstream flask_backend {
    server flask-app:5000;
}

# --- plain HTTP: health + redirect -----------------------------------------
server {
    listen 80;
    server_name _;

    # nginx-level health for external load balancers / uptime checks
    # (no client cert required, so monitors can reach it).
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- TLS + mTLS ------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    # server_name _ accepts any host; the client cert, not the hostname, gates
    # access. If you move to a Let's Encrypt cert, set this to your real domain.
    server_name _;

    # server identity (generated by scripts/gen-certs.sh)
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1h;

    # --- mutual TLS: only certs signed by our CA may connect ---------------
    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client      on;
    ssl_verify_depth       1;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        # rate limit (zone defined in nginx.prod.conf http{})
        limit_req      zone=api burst=20 nodelay;
        limit_req_status 429;
        limit_conn     conns 10;

        proxy_pass http://flask_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # pass the verified client identity through to Flask if it wants it
        proxy_set_header X-Client-Cert-CN $ssl_client_s_dn;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
