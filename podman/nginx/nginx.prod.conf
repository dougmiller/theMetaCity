# theMetaCity — PRODUCTION nginx config (TLS + mTLS + rate limiting).
# Used only by podman-compose.prod.yml. The dev nginx.conf is untouched.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'clientcert="$ssl_client_s_dn" verify="$ssl_client_verify"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # --- rate limiting -----------------------------------------------------
    # Steady 10 req/s per client IP (burst 20). Declaring the zone here is
    # inert until a location opts in with `limit_req` (see conf.d.prod).
    limit_req_zone  $binary_remote_addr zone=api:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conns:10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               image/svg+xml;

    # prod-only server block (mounted read-only by podman-compose.prod.yml).
    include /etc/nginx/conf.d.prod/*.conf;
}
