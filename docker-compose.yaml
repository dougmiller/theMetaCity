services:
  postgres:
    container_name: tmc_postgres
    image: postgres:18.0-bookworm
    env_file:
      - ./docker/db/.env
      - ./docker/db/credentials.env
    volumes:
      - ./docker/db/startup-files/100_create_users.sh:/docker-entrypoint-initdb.d/100_create_users.sh
      - ./docker/db/startup-files/110_create_databases.sh:/docker-entrypoint-initdb.d/110_create_databases.sh
      #- ./docker/db/startup-files/120_create_schema_functions.sh:/docker-entrypoint-initdb.d/120_create_schema_functions.sh
      - ./docker/db/startup-files/200_com_create_schema.sh:/docker-entrypoint-initdb.d/200_com_create_schema.sh
      - ./docker/db/startup-files/210_com_create_tables.sh:/docker-entrypoint-initdb.d/210_com_create_tables.sh
      - ./docker/db/startup-files/220_com_populate_article_tags.sh:/docker-entrypoint-initdb.d/220_com_populate_article_tags.sh
      - ./docker/db/startup-files/221_com_populate_articles.sql:/docker-entrypoint-initdb.d/221_com_populate_articles.sql
      - ./docker/db/startup-files/222_com_populate_article_tags_joiner.sh:/docker-entrypoint-initdb.d/222_com_populate_article_tags_joiner.sh
      - ./docker/db/startup-files/250_com_finish_schema.sh:/docker-entrypoint-initdb.d/250_com_finish_schema.sh
      - ./docker/db/startup-files/300_create_schema_media.sh:/docker-entrypoint-initdb.d/300_create_schema_media.sh
      - ./docker/db/startup-files/310_populate_media_tables.sh:/docker-entrypoint-initdb.d/310_populate_media_tables.sh
      - ./docker/db/startup-files/400_create_schema_everyday_ordinary.sh:/docker-entrypoint-initdb.d/400_create_schema_everyday_ordinary.sh
      - ./docker/db/startup-files/410_populate_everyday_ordinary_tables.sh:/docker-entrypoint-initdb.d/410_populate_everyday_ordinary_tables.sh
      - ./docker/db/startup-files/500_setup_hba.sh:/docker-entrypoint-initdb.d/500_setup_hba.sh
      - ./docker/db/startup-files/510_setup_pgpass.sh:/docker-entrypoint-initdb.d/510_setup_pgpass.sh
    ports:
      - "5432:5432"
    networks:
      - database
    restart: unless-stopped

  postgres17:
    container_name: tmc_postgres_17
    image: postgres:17.2-alpine
    env_file:
       - ./docker/db/.env
       - ./docker/db/credentials.env
    volumes:
      - ./docker/db/startup-files/100_create_users.sh:/docker-entrypoint-initdb.d/100_create_users.sh
      - ./docker/db/startup-files/200_create_databases.sh:/docker-entrypoint-initdb.d/200_create_databases.sh
      - ./docker/db/startup-files/210_create_schema_functions.sh:/docker-entrypoint-initdb.d/210_create_schema_functions.sh
      - ./docker/db/startup-files/211_create_schema_com.sh:/docker-entrypoint-initdb.d/211_create_schema_com.sh
      - ./docker/db/startup-files/212_create_schema_media.sh:/docker-entrypoint-initdb.d/212_create_schema_media.sh
      - ./docker/db/startup-files/213_create_schema_everyday_ordinary.sh:/docker-entrypoint-initdb.d/213_create_schema_everyday_ordinary.sh
      - ./docker/db/startup-files/290_finalise_schemas.sh:/docker-entrypoint-initdb.d/290_finalise_schemas.sh
      - ./docker/db/startup-files/310_populate_com_tables.sh:/docker-entrypoint-initdb.d/310_populate_com_tables.sh
      - ./docker/db/startup-files/311_populate_com_tables_articles_only.sql:/docker-entrypoint-initdb.d/311_populate_com_tables_articles_only.sql
      - ./docker/db/startup-files/312_populate_com_tables.sh:/docker-entrypoint-initdb.d/312_populate_com_tables.sh
      - ./docker/db/startup-files/320_populate_media_tables.sh:/docker-entrypoint-initdb.d/320_populate_media_tables.sh
      - ./docker/db/startup-files/330_populate_everyday_ordinary_tables.sh:/docker-entrypoint-initdb.d/330_populate_everyday_ordinary_tables.sh
      - ./docker/db/startup-files/500_setup_hba.sh:/docker-entrypoint-initdb.d/500_setup_hba.sh
      - ./docker/db/startup-files/510_setup_pgpass.sh:/docker-entrypoint-initdb.d/510_setup_pgpass.sh
    ports:
      - "5433:5432"
    networks:
      - database
    restart: unless-stopped

  nginx:
    image: nginx:1.27.4
    container_name: tmc_nginx
    volumes:
      - ./docker/web/nginx/startup-files/100-setup-apt.sh:/docker-entrypoint.d/100-setup-apt.sh
      - ./docker/web/nginx/startup-files/200-install-python.sh:/docker-entrypoint.d/200-install-python.sh
      - ./docker/web/nginx/startup-files/300-install-uwsgi.sh:/docker-entrypoint.d/300-install-uwsgi.sh
      - ./docker/web/nginx/startup-files/400-setup-nginx.sh:/docker-entrypoint.d/400-setup-nginx.sh
      - ./docker/web/nginx/startup-files/450-setup-pgpass.sh:/docker-entrypoint.d/450-setup-pgpass.sh
      - ./docker/web/nginx/startup-files/500-setup-uwsgi.sh:/docker-entrypoint.d/500-setup-uwsgi.sh
      - ./docker/web/uwsgi/apps-enabled/:/etc/uwsgi/apps-enabled/
      - ./docker/web/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/web/nginx/snippets/:/etc/nginx/snippets/
      - ./docker/web/nginx/sites-enabled/:/etc/nginx/sites-enabled/
      - ./:/srv/http/www.themetacity.test
    ports:
      - "80:80"
    env_file:
     - ./docker/db/credentials.env
    networks:
      - cache
      - database
    restart: no
    depends_on:
      - postgres

  memcache:
    container_name: tmc_memcached
    image: memcached:1.6.36-alpine
    ports:
     - "11211:11211"
    networks:
    - cache
    restart: unless-stopped
    depends_on:
    - nginx

networks:
  database:
    driver: bridge
  cache:
    driver: bridge

volumes:
  postgres:
    driver: local